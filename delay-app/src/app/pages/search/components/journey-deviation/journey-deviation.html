@if( routeStation(); as station ){
    <span class="no-margin no-padding">
        @if( station.deviation !== null){
            <b class="delay-text">{{ formatDateDeviation(station.time, station.deviation) | date:'HH:mm' }}</b>
            <del class="deviation-text">{{ station.time | date:'HH:mm' }}</del>
        }
        @else {
            <b>{{ station.time | date:'HH:mm' }} </b>
        }
    </span>
